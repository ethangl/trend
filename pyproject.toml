[project]
name = "trend"
version = "0.2.0"
description = "Diversified multi-strategy futures trading on IBKR micros (Clenow-style)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
live = ["ib_async>=1.0.3"]
